name: Build Android APK
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm install

    - name: Build Web resources
      run: npm run build

    - name: Override CMakeLists with minimal version
      run: |
        cat > android/app/src/main/cpp/CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.22.1)
        project(mikuplay_encoder)
        add_library(mikuplay_encoder SHARED dummy.cpp)
        EOF
        echo "" > android/app/src/main/cpp/dummy.cpp

    - name: Fix cordova plugin references
      run: |
        mkdir -p android/capacitor-cordova-android-plugins/src/main
        cat > android/capacitor-cordova-android-plugins/build.gradle << 'EOF'
        apply plugin: 'com.android.library'
        android {
            namespace 'com.getcapacitor.cordova'
            compileSdk 35
            defaultConfig {
                minSdk 24
            }
        }
        EOF
        echo "" > android/capacitor-cordova-android-plugins/cordova.variables.gradle

    - name: Sync Capacitor
      run: npx cap sync android

    - name: Build Debug APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MikuPlay-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
