<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <title>MikuPlay Reburn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
            z-index: 9999;
            transition: opacity 0.3s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top-color: #39c5bb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            margin-top: 16px;
            color: #333333;
            font-size: 14px;
            opacity: 0.8;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 错误信息界面样式 */
        #error-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            z-index: 10000;
            padding: 24px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        #error-screen.visible {
            display: flex;
        }

        /* 错误内容容器 */
        .error-content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
            margin: auto 0;
            padding: 24px 0;
        }

        .error-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            background-color: #ff6b6b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            color: white;
            flex-shrink: 0;
        }

        .error-title {
            font-size: 20px;
            font-weight: 600;
            color: #212121;
            margin-bottom: 8px;
            text-align: center;
            flex-shrink: 0;
        }

        .error-subtitle {
            font-size: 14px;
            color: #757575;
            margin-bottom: 16px;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;
            flex-shrink: 0;
        }

        /* 错误类型标签 */
        .error-type-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .error-type-badge.webview {
            background-color: #ffebee;
            color: #c62828;
        }

        .error-type-badge.webgl {
            background-color: #fff3e0;
            color: #ef6c00;
        }

        .error-type-badge.babylon {
            background-color: #f3e5f5;
            color: #7b1fa2;
        }

        .error-type-badge.capacitor {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .error-type-badge.other {
            background-color: #f5f5f5;
            color: #616161;
        }

        .error-type-badge.timeout {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        /* 错误详情卡片 */
        .error-card {
            background-color: white;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
        }

        .error-card-title {
            font-size: 14px;
            font-weight: 600;
            color: #212121;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-card-title-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: white;
            flex-shrink: 0;
        }

        .error-card-title-icon.error {
            background-color: #ff6b6b;
        }

        .error-card-title-icon.warning {
            background-color: #ffa726;
        }

        .error-card-title-icon.info {
            background-color: #42a5f5;
        }

        .error-detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .error-detail-item:last-child {
            border-bottom: none;
        }

        .error-detail-label {
            font-size: 13px;
            color: #757575;
        }

        .error-detail-value {
            font-size: 13px;
            color: #212121;
            font-weight: 500;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }

        .error-detail-value.unsupported {
            color: #ff6b6b;
        }

        .error-detail-value.supported {
            color: #4caf50;
        }

        /* 具体错误信息 */
        .error-message-box {
            background-color: #fafafa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-size: 12px;
            color: #616161;
            line-height: 1.5;
            word-break: break-all;
            max-height: 100px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
        }

        .error-message-label {
            font-size: 11px;
            color: #9e9e9e;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        /* 特性支持列表 */
        .error-features {
            background-color: white;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            margin-bottom: 12px;
        }

        .error-features-title {
            font-size: 14px;
            font-weight: 600;
            color: #212121;
            margin-bottom: 12px;
        }

        .error-feature-item {
            display: flex;
            align-items: center;
            padding: 6px 0;
            font-size: 13px;
            color: #616161;
        }

        .error-feature-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .error-feature-status.required {
            background-color: #ff6b6b;
        }

        .error-feature-status.optional {
            background-color: #ffa726;
        }

        .error-feature-status.supported {
            background-color: #4caf50;
        }

        .error-feature-status.unsupported {
            background-color: #bdbdbd;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-spinner"></div>
        <div class="loading-text">加载中...</div>
    </div>

    <div id="error-screen">
        <div class="error-content-wrapper">
            <div class="error-icon">!</div>
            <div class="error-title">似乎遇到了问题</div>
            <div class="error-type-badge timeout" id="error-type-badge">初始化超时</div>
            <div class="error-subtitle" id="error-subtitle">应用初始化超时，可能是您的设备或浏览器版本过低</div>
            
            <!-- 具体错误信息 -->
            <div class="error-card" id="error-details-card" style="display: none;">
                <div class="error-card-title">
                    <div class="error-card-title-icon error">!</div>
                    <span>错误详情</span>
                </div>
                <div class="error-message-label">错误类型</div>
                <div class="error-message-box" id="error-type-text">未知错误</div>
                <div class="error-message-label" style="margin-top: 8px;">错误信息</div>
                <div class="error-message-box" id="error-message-text">无详细信息</div>
            </div>

            <!-- 环境信息 -->
            <div class="error-card">
                <div class="error-card-title">
                    <div class="error-card-title-icon info">i</div>
                    <span>环境信息</span>
                </div>
                <div class="error-detail-item">
                    <span class="error-detail-label">Android 版本</span>
                    <span class="error-detail-value" id="android-version">检测中...</span>
                </div>
                <div class="error-detail-item">
                    <span class="error-detail-label">WebView 版本</span>
                    <span class="error-detail-value" id="webview-version">检测中...</span>
                </div>
                <div class="error-detail-item">
                    <span class="error-detail-label">WebGL 版本</span>
                    <span class="error-detail-value" id="webgl-version">检测中...</span>
                </div>
                <div class="error-detail-item">
                    <span class="error-detail-label">用户代理</span>
                    <span class="error-detail-value" id="user-agent" style="font-size: 11px;">检测中...</span>
                </div>
            </div>

            <!-- 特性支持检测 -->
            <div class="error-features">
                <div class="error-features-title">特性支持状态</div>
                <div class="error-feature-item">
                    <div class="error-feature-status required" id="status-webgl2"></div>
                    <span>WebGL 2.0 - 3D渲染必需</span>
                </div>
                <div class="error-feature-item">
                    <div class="error-feature-status required" id="status-es2020"></div>
                    <span>ES2020+ - JavaScript新特性</span>
                </div>
                <div class="error-feature-item">
                    <div class="error-feature-status required" id="status-wasm"></div>
                    <span>WebAssembly - 物理引擎加速</span>
                </div>
                <div class="error-feature-item">
                    <div class="error-feature-status optional" id="status-webaudio"></div>
                    <span>Web Audio API - 音频处理</span>
                </div>
                <div class="error-feature-item">
                    <div class="error-feature-status optional" id="status-capacitor"></div>
                    <span>Capacitor - 原生功能支持</span>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="./main.ts"></script>
    <script>
        // 初始化超时检测和错误处理
        (function() {
            const INIT_TIMEOUT = 5000; // 5秒超时
            let isInitialized = false;
            let timeoutId = null;
            let capturedError = null;

            // 错误类型定义
            const ErrorType = {
                TIMEOUT: { code: 'TIMEOUT', name: '初始化超时', class: 'timeout' },
                WEBVIEW_UNSUPPORTED: { code: 'WEBVIEW_UNSUPPORTED', name: 'WebView 版本过低', class: 'webview' },
                WEBGL_UNSUPPORTED: { code: 'WEBGL_UNSUPPORTED', name: 'WebGL 不支持', class: 'webgl' },
                BABYLON_ERROR: { code: 'BABYLON_ERROR', name: 'Babylon 引擎错误', class: 'babylon' },
                CAPACITOR_ERROR: { code: 'CAPACITOR_ERROR', name: 'Capacitor 错误', class: 'capacitor' },
                UNKNOWN: { code: 'UNKNOWN', name: '未知错误', class: 'other' }
            };

            // 检测 Android 版本
            function detectAndroidVersion() {
                const match = navigator.userAgent.match(/Android\s([0-9.]+)/);
                return match ? match[1] : '未知';
            }

            // 检测 WebView / 浏览器版本
            function detectWebViewVersion() {
                const ua = navigator.userAgent;
                const chromeMatch = ua.match(/Chrome\/([0-9.]+)/);
                const webviewMatch = ua.match(/Version\/([0-9.]+)/);
                const edgeMatch = ua.match(/Edg\/([0-9.]+)/);
                const firefoxMatch = ua.match(/Firefox\/([0-9.]+)/);
                const safariMatch = ua.match(/Safari\/([0-9.]+)/);
                
                if (chromeMatch) {
                    // 检测是否在 Android WebView 中
                    if (ua.includes('Android') && !ua.includes('Chrome/')) {
                        return 'WebView ' + chromeMatch[1];
                    }
                    return 'Chrome/' + chromeMatch[1];
                } else if (edgeMatch) {
                    return 'Edge/' + edgeMatch[1];
                } else if (firefoxMatch) {
                    return 'Firefox/' + firefoxMatch[1];
                } else if (webviewMatch) {
                    return 'WebView ' + webviewMatch[1];
                } else if (safariMatch) {
                    return 'Safari/' + safariMatch[1];
                }
                return ua.substring(0, 60);
            }

            // 获取 Chrome 版本号
            function getChromeVersion() {
                const match = navigator.userAgent.match(/Chrome\/([0-9]+)/);
                return match ? parseInt(match[1], 10) : 0;
            }

            // 检测 WebGL 版本
            function detectWebGLVersion() {
                const canvas = document.createElement('canvas');
                let gl = null;
                
                try {
                    gl = canvas.getContext('webgl2');
                    if (gl) return { version: 'WebGL 2.0', supported: true };
                    
                    gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                    if (gl) return { version: 'WebGL 1.0', supported: false };
                    
                    return { version: '不支持', supported: false };
                } catch (e) {
                    return { version: '检测失败', supported: false };
                }
            }

            // 检测 ES2020 支持
            function checkES2020Support() {
                try {
                    // 检测 Promise.allSettled (ES2020)
                    if (typeof Promise.allSettled !== 'function') return false;
                    // 检测 globalThis (ES2020)
                    if (typeof globalThis === 'undefined') return false;
                    // 检测 String.prototype.matchAll (ES2020)
                    if (typeof String.prototype.matchAll !== 'function') return false;
                    // 检测 ?. 运算符 (ES2020)
                    eval('const a = {}; const b = a?.x');
                    // 检测 ?? 运算符 (ES2020)
                    eval('const c = null ?? 1');
                    return true;
                } catch (e) {
                    return false;
                }
            }

            // 检测 WebAssembly 支持
            function checkWasmSupport() {
                return typeof WebAssembly === 'object' && 
                       typeof WebAssembly.instantiate === 'function';
            }

            // 检测 Web Audio API 支持
            function checkWebAudioSupport() {
                return typeof AudioContext !== 'undefined' || 
                       typeof webkitAudioContext !== 'undefined';
            }

            // 检测 Capacitor 支持
            function checkCapacitorSupport() {
                // 检测是否在 Capacitor 环境中
                return navigator.userAgent.includes('Capacitor') || 
                       typeof (window).Capacitor !== 'undefined';
            }

            // ========== 最低版本要求 ==========
            var MIN_CHROME_VERSION = 92;

            // ========== 主动前置检查（在 app 加载前执行） ==========
            function runPreflightChecks() {
                var chromeVersion = getChromeVersion();
                
                // 1. 检查 Chrome / WebView 版本
                if (chromeVersion > 0 && chromeVersion < MIN_CHROME_VERSION) {
                    var error = new Error('WebView 版本过低：Chrome ' + chromeVersion + '，需要 ' + MIN_CHROME_VERSION + '+');
                    error.code = 'WEBVIEW_UNSUPPORTED';
                    return error;
                }
                
                // 2. 检查 ES2020 支持
                if (!checkES2020Support()) {
                    var error = new Error('浏览器不支持 ES2020 特性');
                    error.code = 'WEBVIEW_UNSUPPORTED';
                    return error;
                }
                
                // 3. 检查 WebAssembly（物理引擎必需）
                if (!checkWasmSupport()) {
                    var error = new Error('浏览器不支持 WebAssembly');
                    error.code = 'UNKNOWN';
                    return error;
                }
                
                // 4. 检查 WebGL 2.0（3D 渲染必需）
                var webglInfo = detectWebGLVersion();
                if (!webglInfo.supported) {
                    var error = new Error('浏览器不支持 WebGL 2.0');
                    error.code = 'WEBGL_UNSUPPORTED';
                    return error;
                }
                
                return null; // 所有检查通过
            }

            // ========== 执行前置检查 ==========
            var preflightError = runPreflightChecks();
            if (preflightError) {
                isInitialized = true; // 防止超时重复触发
                showErrorScreen(preflightError);
                return; // 阻止后续代码（超时设置等）
            }

            // 分析错误类型
            function analyzeError(error) {
                if (!error) return ErrorType.TIMEOUT;

                // 优先使用预置错误码（来自 preflight checks）
                if (error.code === 'WEBVIEW_UNSUPPORTED') return ErrorType.WEBVIEW_UNSUPPORTED;
                if (error.code === 'WEBGL_UNSUPPORTED') return ErrorType.WEBGL_UNSUPPORTED;
                if (error.code === 'BABYLON_ERROR') return ErrorType.BABYLON_ERROR;
                if (error.code === 'CAPACITOR_ERROR') return ErrorType.CAPACITOR_ERROR;
                
                const errorString = (error.message || error.toString()).toLowerCase();
                const stack = (error.stack || '').toLowerCase();
                
                // WebGL 相关错误
                if (errorString.includes('webgl') || 
                    errorString.includes('gl') ||
                    stack.includes('babylon') && (errorString.includes('context') || errorString.includes('canvas'))) {
                    return ErrorType.WEBGL_UNSUPPORTED;
                }
                
                // Babylon 引擎错误
                if (stack.includes('babylon') || stack.includes('@babylonjs') ||
                    errorString.includes('babylon') || errorString.includes('engine')) {
                    return ErrorType.BABYLON_ERROR;
                }
                
                // Capacitor 错误
                if (stack.includes('capacitor') || errorString.includes('capacitor') ||
                    errorString.includes('native') || errorString.includes('plugin')) {
                    return ErrorType.CAPACITOR_ERROR;
                }
                
                // WebView 版本相关错误
                if (errorString.includes('syntax') || errorString.includes('unexpected') ||
                    errorString.includes('expected') || errorString.includes('module')) {
                    const chromeVersion = getChromeVersion();
                    if (chromeVersion > 0 && chromeVersion < 100) {
                        return ErrorType.WEBVIEW_UNSUPPORTED;
                    }
                }
                
                return ErrorType.UNKNOWN;
            }

            // 显示错误界面
            function showErrorScreen(error) {
                const loading = document.getElementById('loading');
                const errorScreen = document.getElementById('error-screen');
                
                if (loading) {
                    loading.style.display = 'none';
                }
                
                if (errorScreen) {
                    errorScreen.classList.add('visible');
                    
                    // 分析错误类型
                    const errorType = analyzeError(error);
                    const webglInfo = detectWebGLVersion();
                    
                    // 更新错误类型标签
                    const badge = document.getElementById('error-type-badge');
                    badge.textContent = errorType.name;
                    badge.className = 'error-type-badge ' + errorType.class;
                    
                    // 更新副标题
                    const subtitle = document.getElementById('error-subtitle');
                    if (errorType.code === 'TIMEOUT') {
                        subtitle.textContent = '应用初始化超时，可能是您的设备或浏览器版本过低';
                    } else {
                        subtitle.textContent = '初始化过程中遇到错误';
                    }
                    
                    // 显示具体错误信息
                    if (error) {
                        document.getElementById('error-details-card').style.display = 'block';
                        document.getElementById('error-type-text').textContent = errorType.name + ' (' + errorType.code + ')';
                        document.getElementById('error-message-text').textContent = error.message || error.toString();
                    }
                    
                    // 填充环境信息
                    document.getElementById('android-version').textContent = detectAndroidVersion();
                    document.getElementById('webview-version').textContent = detectWebViewVersion();
                    
                    const webglElement = document.getElementById('webgl-version');
                    webglElement.textContent = webglInfo.version;
                    webglElement.className = 'error-detail-value ' + (webglInfo.supported ? 'supported' : 'unsupported');
                    
                    document.getElementById('user-agent').textContent = navigator.userAgent;
                    
                    // 更新特性支持状态
                    document.getElementById('status-webgl2').className = 'error-feature-status ' + 
                        (webglInfo.supported ? 'supported' : 'unsupported');
                    document.getElementById('status-es2020').className = 'error-feature-status ' + 
                        (checkES2020Support() ? 'supported' : 'unsupported');
                    document.getElementById('status-wasm').className = 'error-feature-status ' + 
                        (checkWasmSupport() ? 'supported' : 'unsupported');
                    document.getElementById('status-webaudio').className = 'error-feature-status ' + 
                        (checkWebAudioSupport() ? 'supported' : 'unsupported');
                    document.getElementById('status-capacitor').className = 'error-feature-status ' + 
                        (checkCapacitorSupport() ? 'supported' : 'unsupported');
                }
            }

            // 标记初始化成功
            window.markAppInitialized = function() {
                isInitialized = true;
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
            };

            // 报告初始化错误
            window.reportInitError = function(error) {
                console.error('[Init] 初始化错误:', error);
                capturedError = error;
                isInitialized = true; // 停止超时检测
                if (timeoutId) {
                    clearTimeout(timeoutId);
                    timeoutId = null;
                }
                showErrorScreen(error);
            };

            // 全局错误捕获
            window.addEventListener('error', function(event) {
                // 只捕获初始化阶段的错误
                if (!isInitialized) {
                    console.error('[Init] 捕获全局错误:', event.error);
                    window.reportInitError(event.error || new Error(event.message));
                }
            });

            // 捕获 Promise 未处理的 rejection
            window.addEventListener('unhandledrejection', function(event) {
                if (!isInitialized) {
                    console.error('[Init] 捕获未处理的 Promise 拒绝:', event.reason);
                    const error = event.reason instanceof Error ? event.reason : new Error(String(event.reason));
                    window.reportInitError(error);
                }
            });

            // 设置超时检测
            timeoutId = setTimeout(function() {
                if (!isInitialized) {
                    console.error('[Init] 应用初始化超时，耗时 ' + INIT_TIMEOUT + 'ms');
                    showErrorScreen(capturedError);
                }
            }, INIT_TIMEOUT);

            // 页面加载完成后的额外检查
            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (!isInitialized) {
                        console.error('[Init] Force showing error screen after 12s');
                        showErrorScreen(capturedError);
                    }
                }, 12000);
            });
        })();
    </script>
</body>
</html>
