<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 网格顶部渐隐渐变 (0~55隐藏, 55~78过渡, 78+可见) -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0F0" stop-opacity="1"/>
      <stop offset="35%" stop-color="#F0F0F0" stop-opacity="1"/>
      <stop offset="60%" stop-color="#F0F0F0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F0F0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="128" height="128" fill="#F0F0F0"/>
  <!-- 网格：XOZ平面，视角(-1,-1,-1)，菱形网格，最长对角线~42px，30条线，Y轴方向压扁 -->
  <g transform="translate(0, 64) scale(1, 0.55) translate(0, -64)">
  <g stroke="#a8a8a8ff" stroke-width="1.5" opacity="0.7">
    <line x1="-100" y1="-84" x2="228" y2="105.3"/>
    <line x1="-100" y1="-60" x2="228" y2="129.3"/>
    <line x1="-100" y1="-36" x2="228" y2="153.3"/>
    <line x1="-100" y1="-12" x2="228" y2="177.3"/>
    <line x1="-100" y1="12" x2="228" y2="201.3"/>
    <line x1="-100" y1="36" x2="228" y2="225.3"/>
    <line x1="-100" y1="60" x2="228" y2="249.3"/>
    <line x1="-100" y1="84" x2="228" y2="273.3"/>
    <line x1="-100" y1="108" x2="228" y2="297.3"/>
    <line x1="-100" y1="132" x2="228" y2="321.3"/>
    <line x1="-100" y1="156" x2="228" y2="345.3"/>
    <line x1="-100" y1="180" x2="228" y2="369.3"/>
    <line x1="-100" y1="204" x2="228" y2="393.3"/>
    <line x1="-100" y1="228" x2="228" y2="417.3"/>
    <line x1="-100" y1="252" x2="228" y2="441.3"/>
    <line x1="-100" y1="12" x2="228" y2="-177.3"/>
    <line x1="-100" y1="36" x2="228" y2="-153.3"/>
    <line x1="-100" y1="60" x2="228" y2="-129.3"/>
    <line x1="-100" y1="84" x2="228" y2="-105.3"/>
    <line x1="-100" y1="108" x2="228" y2="-81.3"/>
    <line x1="-100" y1="132" x2="228" y2="-57.3"/>
    <line x1="-100" y1="156" x2="228" y2="-33.3"/>
    <line x1="-100" y1="180" x2="228" y2="-9.3"/>
    <line x1="-100" y1="204" x2="228" y2="14.7"/>
    <line x1="-100" y1="228" x2="228" y2="38.7"/>
    <line x1="-100" y1="252" x2="228" y2="62.7"/>
    <line x1="-100" y1="276" x2="228" y2="86.7"/>
    <line x1="-100" y1="300" x2="228" y2="110.7"/>
    <line x1="-100" y1="324" x2="228" y2="134.7"/>
    <line x1="-100" y1="348" x2="228" y2="158.7"/>
  </g>
  </g>
  <!-- 网格顶部渐隐遮罩 -->
  <rect width="128" height="128" fill="url(#gridFade)"/>
  <g transform="translate(64, 64)">
    <!-- 坐标轴 -->
    <line x1="0" y1="0" x2="55.426" y2="32" stroke="#ff6c6cff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#33ff33ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-55.426" y2="32" stroke="#0088ffff" stroke-width="4" stroke-linecap="round"/>
    <!-- 立方体三个可视面填充 -->
    <!-- 顶面 (上方) -->
    <polygon points="0,-48 41.569,-24 0,0 -41.569,-24" fill="#7be5ffff" fill-opacity="0.9"/>
    <!-- 右面 (右侧) -->
    <polygon points="41.569,-24 0,0 0,48 41.569,24" fill="#4cf1caff" fill-opacity="0.9"/>
    <!-- 左面 (左侧) -->
    <polygon points="-41.569,-24 0,0 0,48 -41.569,24" fill="#ffb1d7ff" fill-opacity="0.9"/>
    <!-- 立方体边线 (边长48, 线宽4, 不绘制与坐标轴重合的3条边) -->
    <!-- 平行于X轴的边 -->
    <line x1="0" y1="-48" x2="41.569" y2="-24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="-41.569" y1="24" x2="0" y2="48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="-41.569" y1="-24" x2="0" y2="0" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- 平行于Y轴的边 -->
    <line x1="41.569" y1="24" x2="41.569" y2="-24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="-41.569" y1="24" x2="-41.569" y2="-24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="48" x2="0" y2="0" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- 平行于Z轴的边 -->
    <line x1="41.569" y1="24" x2="0" y2="48" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-48" x2="-41.569" y2="-24" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="41.569" y1="-24" x2="0" y2="0" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- 外边缘辅助线 (虚线, 0.3px, 内外各一条, 两端各超出10px) -->
    <g stroke="#c1c1c1ff" stroke-width="0" stroke-dasharray="3,1">
      <!-- Edge1 B→D ∥X -->
      <line x1="-7.660" y1="-54.732" x2="51.229" y2="-20.732"/>
      <line x1="-9.660" y1="-51.268" x2="49.229" y2="-17.268"/>
      <!-- Edge2 D→A ∥Y -->
      <line x1="43.569" y1="-34" x2="43.569" y2="34"/>
      <line x1="39.569" y1="-34" x2="39.569" y2="34"/>
      <!-- Edge3 A→E ∥Z -->
      <line x1="51.229" y1="20.732" x2="-7.660" y2="54.732"/>
      <line x1="49.229" y1="17.268" x2="-9.660" y2="51.268"/>
      <!-- Edge4 E→C ∥X -->
      <line x1="7.660" y1="54.732" x2="-51.229" y2="20.732"/>
      <line x1="9.660" y1="51.268" x2="-49.229" y2="17.268"/>
      <!-- Edge5 C→F ∥Y -->
      <line x1="-43.569" y1="34" x2="-43.569" y2="-34"/>
      <line x1="-39.569" y1="34" x2="-39.569" y2="-34"/>
      <!-- Edge6 F→B ∥Z -->
      <line x1="-51.229" y1="-20.732" x2="7.660" y2="-54.732"/>
      <line x1="-49.229" y1="-17.268" x2="9.660" y2="-51.268"/>
    </g>
  </g>
  <!-- Android 圆形图标裁剪测试遮罩 -->
  <!-- <circle cx="64" cy="64" r="64" fill="none" stroke="#FF0000" stroke-width="1" opacity="0.6"/> -->
</svg>