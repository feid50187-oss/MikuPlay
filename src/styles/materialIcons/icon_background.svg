<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- 网格顶部渐隐渐变 (0~55隐藏, 55~78过渡, 78+可见) -->
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0F0" stop-opacity="1"/>
      <stop offset="55%" stop-color="#F0F0F0" stop-opacity="1"/>
      <stop offset="78%" stop-color="#F0F0F0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#F0F0F0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="128" height="128" fill="#F0F0F0"/>
  <!-- 网格：XOZ平面，视角(-1,-1,-1)，菱形网格，最长对角线~42px，30条线，Y轴方向压扁 -->
  <g transform="translate(0, 64) scale(1, 0.55) translate(0, -64)">
  <g stroke="#a8a8a8ff" stroke-width="1.5" opacity="0.7">
    <line x1="-100" y1="-84" x2="228" y2="105.3"/>
    <line x1="-100" y1="-60" x2="228" y2="129.3"/>
    <line x1="-100" y1="-36" x2="228" y2="153.3"/>
    <line x1="-100" y1="-12" x2="228" y2="177.3"/>
    <line x1="-100" y1="12" x2="228" y2="201.3"/>
    <line x1="-100" y1="36" x2="228" y2="225.3"/>
    <line x1="-100" y1="60" x2="228" y2="249.3"/>
    <line x1="-100" y1="84" x2="228" y2="273.3"/>
    <line x1="-100" y1="108" x2="228" y2="297.3"/>
    <line x1="-100" y1="132" x2="228" y2="321.3"/>
    <line x1="-100" y1="156" x2="228" y2="345.3"/>
    <line x1="-100" y1="180" x2="228" y2="369.3"/>
    <line x1="-100" y1="204" x2="228" y2="393.3"/>
    <line x1="-100" y1="228" x2="228" y2="417.3"/>
    <line x1="-100" y1="252" x2="228" y2="441.3"/>
    <line x1="-100" y1="12" x2="228" y2="-177.3"/>
    <line x1="-100" y1="36" x2="228" y2="-153.3"/>
    <line x1="-100" y1="60" x2="228" y2="-129.3"/>
    <line x1="-100" y1="84" x2="228" y2="-105.3"/>
    <line x1="-100" y1="108" x2="228" y2="-81.3"/>
    <line x1="-100" y1="132" x2="228" y2="-57.3"/>
    <line x1="-100" y1="156" x2="228" y2="-33.3"/>
    <line x1="-100" y1="180" x2="228" y2="-9.3"/>
    <line x1="-100" y1="204" x2="228" y2="14.7"/>
    <line x1="-100" y1="228" x2="228" y2="38.7"/>
    <line x1="-100" y1="252" x2="228" y2="62.7"/>
    <line x1="-100" y1="276" x2="228" y2="86.7"/>
    <line x1="-100" y1="300" x2="228" y2="110.7"/>
    <line x1="-100" y1="324" x2="228" y2="134.7"/>
    <line x1="-100" y1="348" x2="228" y2="158.7"/>
